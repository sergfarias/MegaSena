<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Mega-Sena 2D - MegaSena SaaS</title>
    <link rel="stylesheet" href="styles.css">
    
    <style>
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        .painel-controles {
            position: fixed;
            left: 250px;
            top: 0;
            width: 320px;
            height: 100vh;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            padding: 20px 15px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 99;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .painel-controles h2 {
            font-size: 1.1rem;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .control-group { display: flex; flex-direction: column; }
        .control-group label { font-size: 0.85rem; margin-bottom: 5px; color: #ccc; }
        .control-group input[type="range"] { width: 100%; accent-color: var(--primary); }
        .control-group select, .control-group input[type="number"] {
            padding: 8px; background: var(--bg-color); color: var(--text-main);
            border: 1px solid var(--border); border-radius: 4px; width: 100%;
            box-sizing: border-box; font-size: 0.9rem;
        }

        .btn-painel {
            width: 100%; padding: 10px; margin-top: 5px; font-size: 0.9rem;
            font-weight: bold; border-radius: 4px; cursor: pointer; border: none;
            transition: background 0.2s;
        }

        .btn-sortear { background-color: var(--success); color: #1a1b26; }
        .btn-sortear:hover { background-color: #b9e88a; }
        .btn-sortear:disabled { background-color: var(--border); cursor: wait; }

        .btn-lote { background-color: #2196F3; color: #fff; }
        .btn-lote:hover { background-color: #1976D2; }
        .btn-lote:disabled { background-color: var(--border); cursor: wait; }

        .btn-uniformidade { background-color: #FF9800; color: #fff; }
        .btn-uniformidade:hover { background-color: #F57C00; }
        .btn-uniformidade:disabled { background-color: var(--border); cursor: wait; }

        .secao-uniformidade { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 15px; }

        #canvas-container {
            margin-left: 570px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
            height: 100vh;
            background: linear-gradient(135deg, #1a1b26 0%, #16161e 100%);
        }

        canvas {
            background-color: #111;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(122, 162, 247, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
            max-width: 95vh;
            max-height: 95vh;
            width: 100%;
            height: auto;
        }

        .modal-fundo {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: none; justify-content: center; align-items: center;
        }

        .modal-box {
            background: var(--panel-bg); padding: 30px; border-radius: 8px;
            border: 1px solid var(--border); max-width: 500px; width: 90%;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-box h2 { margin-top: 0; font-size: 1.4rem; color: #fff; border: none; padding: 0; }
        .modal-box p { color: #ccc; font-size: 0.9rem; line-height: 1.5; }

        .modal-acoes {
            display: flex; gap: 10px; margin-top: 20px;
            justify-content: center; flex-wrap: wrap;
        }

        .modal-acoes button {
            width: auto; flex: 1; min-width: 120px;
            padding: 10px 15px; font-size: 0.9rem; margin-top: 0;
        }

        @media (max-width: 1100px) {
            .painel-controles { position: relative; left: auto; width: 100%; height: auto; max-height: 300px; order: 2; }
            #canvas-container { margin-left: 0; margin-top: 70px; height: 60vh; order: 1; }
            body { flex-direction: column; overflow-y: auto; height: auto; }
        }
    </style>
</head>
<body>

    <button class="btn-abrir" id="btnAbrirMenu" aria-label="Abrir menu">☰</button>
    <div class="overlay-mobile" id="overlayMobile"></div>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            🎰 <span>MegaSena SaaS</span>
            <button class="btn-fechar" id="btnFecharMenu" aria-label="Fechar menu">✕</button>
        </div>
        <nav>
            <a href="index.html">🏠 Início</a>
            <a href="fechamento.html">🎯 Fechamento</a>
            <a href="historico.html">📜 Meus Jogos</a>
            <a href="globo-megasena.html" class="active">🎲 Simulador Físico</a>
            <a href="probabilidade.html">📊 Probabilidades</a>
            <a href="estatisticas.html">🔢 Estatísticas</a>
            <a href="comparador.html">⚖️ Comparador</a>
            <a href="verificar.html">🛡️ Auditoria</a>
            <a href="#" class="btn-sair" onclick="logout()">🚪 Sair</a>
        </nav>
    </aside>

    <div class="painel-controles">
        <h2>⚙️ Ajustes do Sorteio</h2>
        <div class="control-group">
            <label>Velocidade: <span id="valVento">80</span></label>
            <input type="range" id="vento" min="0" max="150" value="80">
        </div>
        <div class="control-group">
            <label>Peso: <span id="valGrav">9.8</span></label>
            <input type="range" id="grav" min="0" max="20" step="0.1" value="9.8">
        </div>
        <div class="control-group">
            <label>Aleatoriedade: <span id="valTurb">0.5</span></label>
            <input type="range" id="turb" min="0" max="2" step="0.1" value="0.5">
        </div>
        <div class="control-group">
            <label>Quique/Salto: <span id="valRest">0.7</span></label>
            <input type="range" id="rest" min="0.1" max="0.99" step="0.01" value="0.7">
        </div>
        <div class="control-group">
            <label>Filtrar Últimos:</label>
            <select id="ultimosSorteios">
                <option value="0">Não filtrar</option>
                <option value="1">Ignorar 1</option>
                <option value="2">Ignorar 2</option>
                <option value="3" selected>Ignorar 3</option>
            </select>
        </div>    
        <div class="control-group">
            <label>Qtd. de Jogos:</label>
            <input type="number" id="qtdJogos" value="1" min="1" max="20">
        </div>

        <button id="btnSortear" class="btn-painel btn-sortear">Sortear (Animado)</button>
        <button id="btnGerarLote" class="btn-painel btn-lote">Gerar Lote (Rápido)</button>

        <div class="secao-uniformidade">
            <h2>🧪 Teste Científico</h2>
            <div class="control-group" style="margin-bottom: 10px;">
                <label>Simulações: <span id="valN">300</span></label>
                <input type="range" id="nSimulacoes" min="10" max="5000" step="10" value="300">
            </div>
            <button id="btnUniformidade" class="btn-painel btn-uniformidade">Globo justo?</button>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <div id="modalFundo" class="modal-fundo">
        <div class="modal-box">
            <div id="iconeModal" style="font-size: 3.5rem; margin-bottom: 15px;">⚖️</div>
            <h2 id="modalTitulo">Analisando...</h2>
            <div id="modalCorpo" style="margin-bottom: 25px; font-size: 0.95rem;"></div>
            <button id="btnFecharModal" onclick="document.getElementById('modalFundo').style.display = 'none'" style="background: var(--success); display: none;">Entendi</button>
        </div>
    </div>

    <div id="modalJogosFundo" class="modal-fundo">
        <div class="modal-box">
            <h2 style="color: var(--success);">🎰 Seus Jogos</h2>
            <p style="margin-top: -10px;">Gerados com sucesso. Boa sorte!</p>
            <div id="modalJogosLista" style="display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; margin: 20px 0; padding-right: 5px;"></div>
            <div class="modal-acoes">
                <button onclick="exportarCSV()" style="background: var(--primary);">📥 Baixar CSV</button>
                <button onclick="irParaFechamento()" style="background: var(--warning); color: #1a1b26;">🎯 Fechamento</button>
                <button onclick="document.getElementById('modalJogosFundo').style.display = 'none'" style="background: var(--success); color: #1a1b26;">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://megasena-api.runasp.net';
        
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('usuarioNome');
            window.location.href = 'login.html';
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const container = document.getElementById('canvas-container');
        const tamanhoTela = Math.min(container.clientWidth * 0.95, container.clientHeight * 0.95);
        canvas.width = tamanhoTela;
        canvas.height = tamanhoTela;
        
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const raioGlobo = (tamanhoTela / 2) * 0.93;

        let config = { gravidade: 9.8, vento: 80, turbulencia: 0.5, restituicao: 0.7 };
        let jogosSalvosParaExportar = [];

        document.getElementById('vento').addEventListener('input', e => {
            config.vento = parseFloat(e.target.value);
            document.getElementById('valVento').innerText = config.vento;
        });
        document.getElementById('grav').addEventListener('input', e => {
            config.gravidade = parseFloat(e.target.value);
            document.getElementById('valGrav').innerText = config.gravidade;
        });
        document.getElementById('turb').addEventListener('input', e => {
            config.turbulencia = parseFloat(e.target.value);
            document.getElementById('valTurb').innerText = config.turbulencia;
        });
        document.getElementById('rest').addEventListener('input', e => {
            config.restituicao = parseFloat(e.target.value);
            document.getElementById('valRest').innerText = config.restituicao;
        });
        document.getElementById('nSimulacoes').addEventListener('input', e => {
            document.getElementById('valN').innerText = e.target.value;
        });

        document.getElementById('btnSortear').addEventListener('click', async () => {
            const btn = document.getElementById('btnSortear');
            const qtd = parseInt(document.getElementById('qtdJogos').value);
            const fisico = false; 
            const ultimos = document.getElementById('ultimosSorteios').value;

            if (qtd < 1) return;
            btn.innerText = `Gerando...`;
            btn.disabled = true;

            try {
                const jogosGerados = [];
                for (let i = 0; i < qtd; i++) {
                    const url = `${API_URL}/api/MegaSena/sortear?fisico=${fisico}&ultimos=${ultimos}&menos=4`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`Erro HTTP: ${response.status}`);
                    const data = await response.json();
                    jogosGerados.push(data.jogos);
                }
                jogosSalvosParaExportar = jogosGerados;
                exibirModalJogos(jogosGerados);
                animarSorteioAPI(jogosGerados[0]);
            } catch (error) {
                alert(`Erro: ${error.message}`);
            } finally {
                btn.innerText = "Sortear (Animado)";
                btn.disabled = false;
            }
        });

        document.getElementById('btnGerarLote').addEventListener('click', async () => {
            const btn = document.getElementById('btnGerarLote');
            const qtd = parseInt(document.getElementById('qtdJogos').value);
            const ultimos = document.getElementById('ultimosSorteios').value;

            if (qtd < 1 || qtd > 50) {
                alert("Escolha uma quantidade entre 1 e 50.");
                return;
            }

            btn.innerText = `Gerando...`;
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/api/MegaSena/gerar-lote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quantidade: qtd, ultimos: parseInt(ultimos), menos: 4, maxPares: 1 })
                });

                if (!response.ok) {
                    const erroData = await response.json();
                    throw new Error(erroData.erro || `Erro HTTP: ${response.status}`);
                }

                const data = await response.json();
                jogosSalvosParaExportar = data.jogos;
                exibirModalJogos(data.jogos);
                animarSorteioAPI(data.jogos[0]);
            } catch (error) {
                alert(`Erro: ${error.message}`);
            } finally {
                btn.innerText = "Gerar Lote (Rápido)";
                btn.disabled = false;
            }
        });

        function exibirModalJogos(jogos) {
            const modalLista = document.getElementById('modalJogosLista');
            modalLista.innerHTML = ""; 
            jogos.forEach((jogo) => {
                const div = document.createElement('div');
                div.style.backgroundColor = 'var(--bg-color)';
                div.style.padding = '12px';
                div.style.borderRadius = '4px';
                div.style.borderLeft = '4px solid var(--success)';
                div.style.fontSize = '1.2rem';
                div.style.fontWeight = 'bold';
                div.style.color = '#FFEB3B';
                div.style.textAlign = 'center';
                div.innerText = jogo.map(n => n.toString().padStart(2, '0')).join(' - ');
                modalLista.appendChild(div);
            });
            document.getElementById('modalJogosFundo').style.display = 'flex';
        }

        document.getElementById('btnUniformidade').addEventListener('click', async () => {
            const btn = document.getElementById('btnUniformidade');
            const nSimulacoes = parseInt(document.getElementById('nSimulacoes').value);
            const ultimos = document.getElementById('ultimosSorteios').value;

            const modalFundo = document.getElementById('modalFundo');
            const iconeModal = document.getElementById('iconeModal');
            const modalTitulo = document.getElementById('modalTitulo');
            const modalCorpo = document.getElementById('modalCorpo');
            const btnFechar = document.getElementById('btnFecharModal');

            iconeModal.innerText = "⏳";
            modalTitulo.innerText = "Investigando...";
            modalTitulo.style.color = "#fff";
            btnFechar.style.display = 'none';
            
            modalCorpo.innerHTML = `Simulando <strong>${nSimulacoes} sorteios</strong> para verificar a uniformidade do globo.`;
            modalFundo.style.display = 'flex';
            
            btn.innerText = "Analisando...";
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/api/MegaSena/uniformidade?fisico=true&n=${nSimulacoes}&ultimos=${ultimos}&menos=4`);
                if (!response.ok) throw new Error("Erro na API");
                const data = await response.json();
                
                if (data.semEvidenciaDeVies) {
                    iconeModal.innerText = "✅";
                    modalTitulo.innerText = "Globo Justo!";
                    modalTitulo.style.color = "var(--success)";
                    modalCorpo.innerHTML = `<strong style="color: var(--success);">Pode confiar!</strong><br><br>As dezenas têm chances iguais. (χ²: ${data.quiQuadrado?.toFixed(2) || '?'}, p: ${data.pValor?.toFixed(4) || '?'})`;
                } else {
                    iconeModal.innerText = "⚠️";
                    modalTitulo.innerText = "Possível Viés!";
                    modalTitulo.style.color = "var(--danger)";
                    modalCorpo.innerHTML = `<strong style="color: var(--danger);">Atenção!</strong><br><br>Algumas dezenas parecem sair mais. Tente rodar com mais simulações.<br><br><span style="font-size:0.8rem;color:#666">(χ²: ${data.quiQuadrado?.toFixed(2) || '?'}, p: ${data.pValor?.toFixed(4) || '?'})</span>`;
                }
            } catch (error) {
                iconeModal.innerText = "❌";
                modalTitulo.innerText = "Erro de Conexão";
                modalTitulo.style.color = "var(--danger)";
                modalCorpo.innerHTML = "Não foi possível conectar ao servidor.";
            } finally {
                btn.innerText = "Globo justo?";
                btn.disabled = false;
                btnFechar.style.display = 'block';
            }
        });

        class Bola {
            constructor(numero, x, y) {
                this.numero = numero;
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = (Math.random() - 0.5) * 5;
                this.raio = 18;
                this.sorteada = false;
            }

            update(dt) {
                if (this.sorteada) {
                    this.y -= 15 * dt;
                    this.x += this.vx * dt;
                    return;
                }
                this.vy += config.gravidade * dt;
                if (this.y > centerY + raioGlobo * 0.3) this.vy -= config.vento * dt;
                this.vx += (Math.random() - 0.5) * config.turbulencia * 10 * dt;
                this.vy += (Math.random() - 0.5) * config.turbulencia * 10 * dt;
                this.vx *= 0.99;
                this.vy *= 0.99;
                this.x += this.vx * dt;
                this.y += this.vy * dt;
            }

            draw(ctx) {
                if (this.sorteada && this.y < -50) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.raio, 0, Math.PI * 2);
                ctx.fillStyle = this.sorteada ? '#FFEB3B' : '#fff';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.stroke();
                ctx.fillStyle = '#000';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.numero, this.x, this.y);
            }
        }

        let bolas = [];
        let animacaoRodando = true;

        function iniciarSimulacao() {
            bolas = [];
            for (let i = 1; i <= 60; i++) {
                const angulo = Math.random() * Math.PI * 2;
                const dist = Math.random() * (raioGlobo - 25);
                const x = centerX + Math.cos(angulo) * dist;
                const y = centerY + Math.sin(angulo) * dist;
                bolas.push(new Bola(i, x, y));
            }
        }

        function atualizarFisica(dt) {
            for (const bola of bolas) bola.update(dt);
            for (let i = 0; i < bolas.length; i++) {
                if (bolas[i].sorteada) continue;
                for (let j = i + 1; j < bolas.length; j++) {
                    if (bolas[j].sorteada) continue;
                    const dx = bolas[i].x - bolas[j].x;
                    const dy = bolas[i].y - bolas[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = bolas[i].raio + bolas[j].raio;
                    if (dist < minDist && dist > 0) {
                        const overlap = (minDist - dist) / 2;
                        const nx = dx / dist;
                        const ny = dy / dist;
                        bolas[i].x += nx * overlap;
                        bolas[i].y += ny * overlap;
                        bolas[j].x -= nx * overlap;
                        bolas[j].y -= ny * overlap;
                        const p = (bolas[i].vx * nx + bolas[i].vy * ny) - (bolas[j].vx * nx + bolas[j].vy * ny);
                        if (p > 0) {
                            bolas[i].vx -= p * nx * config.restituicao;
                            bolas[i].vy -= p * ny * config.restituicao;
                            bolas[j].vx += p * nx * config.restituicao;
                            bolas[j].vy += p * ny * config.restituicao;
                        }
                    }
                }
            }
            for (const bola of bolas) {
                if (bola.sorteada) continue;
                const dx = bola.x - centerX;
                const dy = bola.y - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const limite = raioGlobo - bola.raio;
                if (dist > limite) {
                    const nx = dx / dist;
                    const ny = dy / dist;
                    bola.x = centerX + nx * limite;
                    bola.y = centerY + ny * limite;
                    const velNormal = bola.vx * nx + bola.vy * ny;
                    if (velNormal > 0) {
                        bola.vx -= (1 + config.restituicao) * velNormal * nx;
                        bola.vy -= (1 + config.restituicao) * velNormal * ny;
                    }
                }
            }
        }

        function desenhar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.arc(centerX, centerY, raioGlobo, 0, Math.PI * 2);
            ctx.strokeStyle = 'var(--primary)';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(centerX - 30, centerY - raioGlobo);
            ctx.lineTo(centerX + 30, centerY - raioGlobo);
            ctx.lineWidth = 8;
            ctx.strokeStyle = 'var(--gold)';
            ctx.stroke();
            for (const bola of bolas) bola.draw(ctx);
        }

        let lastTime = performance.now();
        function loop(time) {
            if (!animacaoRodando) return;
            const dt = Math.min((time - lastTime) / 16.66, 2);
            lastTime = time;
            atualizarFisica(dt);
            desenhar();
            requestAnimationFrame(loop);
        }

        function animarSorteioAPI(dezenas) {
            bolas.forEach(b => {
                b.sorteada = false;
                const angulo = Math.random() * Math.PI * 2;
                const dist = Math.random() * (raioGlobo - 25);
                b.x = centerX + Math.cos(angulo) * dist;
                b.y = centerY + Math.sin(angulo) * dist;
            });
            setTimeout(() => {
                dezenas.forEach((numero, index) => {
                    setTimeout(() => {
                        const bola = bolas.find(b => b.numero === numero && !b.sorteada);
                        if (bola) bola.sorteada = true;
                    }, index * 300);
                });
            }, 500);
        }

        function exportarCSV() {
            if (jogosSalvosParaExportar.length === 0) {
                alert("Nenhum jogo para exportar.");
                return;
            }
            let csvContent = "Jogo;Dezena1;Dezena2;Dezena3;Dezena4;Dezena5;Dezena6\n";
            jogosSalvosParaExportar.forEach((jogo, index) => {
                const dezenasOrdenadas = [...jogo].sort((a, b) => a - b);
                csvContent += `${index + 1};${dezenasOrdenadas.map(n => n.toString().padStart(2, '0')).join(';')}\n`;
            });
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `meus_jogos_megasena_${new Date().getTime()}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function irParaFechamento() {
            if (jogosSalvosParaExportar.length === 0) return;
            const todasAsDezenas = new Set();
            jogosSalvosParaExportar.forEach(jogo => jogo.forEach(d => todasAsDezenas.add(d)));
            localStorage.setItem('dezenasParaFechamento', JSON.stringify(Array.from(todasAsDezenas)));
            window.location.href = 'fechamento.html';
        }

        iniciarSimulacao();
        requestAnimationFrame(loop);

        // Script do Hamburger
        (function() {
            const btnAbrir = document.getElementById('btnAbrirMenu');
            const btnFechar = document.getElementById('btnFecharMenu');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlayMobile');
            if (!sidebar || !overlay) return;
            function fecharMenu() { sidebar.classList.remove('aberta'); overlay.classList.remove('ativo'); }
            if (btnAbrir) btnAbrir.addEventListener('click', () => { sidebar.classList.add('aberta'); overlay.classList.add('ativo'); });
            if (btnFechar) btnFechar.addEventListener('click', fecharMenu);
            if (overlay) overlay.addEventListener('click', fecharMenu);
        })();
    </script>
</body>
</html>
