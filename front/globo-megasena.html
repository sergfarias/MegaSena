﻿<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Simulador Mega-Sena 2D</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --text-main: #fff;
            --primary: #4CAF50;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            overflow-y: auto;
            max-height: 100vh;
        }

        .menu-topo {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 15px;
            flex-wrap: wrap;
        }

        .menu-topo a {
            color: #aaa;
            text-decoration: none;
            font-size: 0.8rem;
            padding: 5px 8px;
            border-radius: 4px;
            background: #333;
            transition: all 0.2s;
        }

        .menu-topo a:hover {
            background: var(--primary);
            color: #fff;
        }

        h1 {
            font-size: 1.2rem;
            margin-top: 0;
            color: var(--primary);
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #ccc;
        }

        input[type="range"] {
            width: 100%;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            cursor: pointer;
            font-size: 1rem;
            border-radius: 4px;
            margin-top: 10px;
            transition: background 0.2s;
            width: 100%;
            font-weight: bold;
        }

        button:hover {
            background-color: #45a049;
        }
        
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        
        .btn-lote {
            background-color: #2196F3;
        }
        
        .btn-lote:hover {
            background-color: #1976D2;
        }

        #canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            background-color: #111;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(76, 175, 80, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
            max-width: 90vh;
            max-height: 90vh;
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        
        <div class="menu-topo">
            <a href="index.html">🏠 Início</a>
            <a href="fechamento.html">🎯 Fechamento</a>
            <a href="historico.html">📜 Meus Jogos</a>
			            <a href="probabilidade.html">📊 Probabilidades</a>
<a href="estatisticas.html" class="active">🔢 Estatísticas</a>
<a href="comparador.html" class="active">⚖️ Comparador</a>
            <a href="verificar.html">🛡️ Auditoria</a>
			<a href="#" onclick="logout()" style="color: #f7768e; border: 1px solid #f7768e;">🚪 Sair</a>
        </div>

        <h1>Ajustes do Sorteio</h1>

        <div class="control-group">
            <label>Velocidade das Dezenas: <span id="valVento">80</span></label>
            <input type="range" id="vento" min="0" max="150" value="80">
        </div>

        <div class="control-group">
            <label>Peso das Dezenas: <span id="valGrav">9.8</span></label>
            <input type="range" id="grav" min="0" max="20" step="0.1" value="9.8">
        </div>

        <div class="control-group">
            <label>Aleatoriedade das Dezenas: <span id="valTurb">0.5</span></label>
            <input type="range" id="turb" min="0" max="2" step="0.1" value="0.5">
        </div>

        <div class="control-group">
            <label>Quique/Salto das Dezenas: <span id="valRest">0.7</span></label>
            <input type="range" id="rest" min="0.1" max="0.99" step="0.01" value="0.7">
        </div>

        <div class="control-group">
			<label>Filtrar Últimos Sorteios:</label>
			<select id="ultimosSorteios" style="padding: 5px; background: #333; color: white; border: 1px solid #555;">
				<option value="0">Não filtrar (Globo cheio)</option>
				<option value="1">Ignorar 1 sorteio</option>
				<option value="2">Ignorar 2 sorteios</option>
				<option value="3" selected>Ignorar 3 sorteios (Padrão)</option>
			</select>
		</div>    
		
		<div class="control-group" style="margin-top: 10px;">
            <label>Quantidade de Jogos (Aposta):</label>
            <input type="number" id="qtdJogos" value="1" min="1" max="20" style="padding: 8px; background: #333; color: white; border: 1px solid #555; border-radius: 4px;">
        </div>

        <!-- DOIS BOTÕES -->
		<button id="btnSortear">Sortear Dezenas (Animado)</button>
        <button id="btnGerarLote" class="btn-lote">Gerar Lote (Rápido)</button>

        <!-- CONTROLES DE UNIFORMIDADE -->
        <div style="margin-top: 20px; border-top: 1px solid #444; padding-top: 15px;">
            <div class="control-group">
                <label>Qtd. de Simulações (Teste): <span id="valN">300</span></label>
                <input type="range" id="nSimulacoes" min="10" max="5000" step="10" value="300">
            </div>

            <button id="btnUniformidade" style="background-color: #FF9800;">Analisar se o globo é justo</button>
        </div>
		
    </div>

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <!-- MODAL DE UNIFORMIDADE -->
    <div id="modalFundo" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: #252526; padding: 30px; border-radius: 8px; border: 1px solid #444; max-width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            
            <div id="iconeModal" style="font-size: 3.5rem; margin-bottom: 15px;">⚖️</div>
            <h2 id="modalTitulo" style="margin-top: 0; font-size: 1.5rem; color: #fff;">Analisando...</h2>
            
            <div id="modalCorpo" style="font-size: 0.95rem; line-height: 1.6; margin-bottom: 25px; color: #ccc;"></div>

            <button id="btnFecharModal" onclick="document.getElementById('modalFundo').style.display = 'none'" style="background: #4CAF50; width: 100%; display: none;">Entendi</button>
        </div>
    </div>

    <!-- MODAL DE JOGOS GERADOS -->
    <div id="modalJogosFundo" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: #252526; padding: 30px; border-radius: 8px; border: 1px solid #444; max-width: 500px; width: 90%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <h2 style="margin-top: 0; font-size: 1.5rem; color: #4CAF50;">🎰 Seus Jogos</h2>
            <p style="color: #aaa; font-size: 0.9rem; margin-top: -10px;">Gerados com sucesso. Boa sorte!</p>
            
            <div id="modalJogosLista" style="display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; margin: 20px 0; padding-right: 5px;"></div>

            <div style="display: flex; gap: 10px; margin-top: 15px; justify-content: center;">
                <button onclick="exportarCSV()" style="background: #2196F3; margin-top: 0; flex: 1;">📥 Baixar CSV</button>
                <button onclick="irParaFechamento()" style="background: #FF9800; margin-top: 0; flex: 1;">🎯 Fechamento</button>
                <button onclick="document.getElementById('modalJogosFundo').style.display = 'none'" style="background: #4CAF50; margin-top: 0; flex: 1;">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('usuarioNome');
            window.location.href = 'login.html';
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const tamanhoTela = Math.min(window.innerWidth * 0.7, window.innerHeight * 0.9);
        canvas.width = tamanhoTela;
        canvas.height = tamanhoTela;
        
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const raioGlobo = (tamanhoTela / 2) * 0.93;

        let config = { gravidade: 9.8, vento: 80, turbulencia: 0.5, restituicao: 0.7 };
        let jogosSalvosParaExportar = [];

        // Controles de física
        document.getElementById('vento').addEventListener('input', e => {
            config.vento = parseFloat(e.target.value);
            document.getElementById('valVento').innerText = config.vento;
        });
        document.getElementById('grav').addEventListener('input', e => {
            config.gravidade = parseFloat(e.target.value);
            document.getElementById('valGrav').innerText = config.gravidade;
        });
        document.getElementById('turb').addEventListener('input', e => {
            config.turbulencia = parseFloat(e.target.value);
            document.getElementById('valTurb').innerText = config.turbulencia;
        });
        document.getElementById('rest').addEventListener('input', e => {
            config.restituicao = parseFloat(e.target.value);
            document.getElementById('valRest').innerText = config.restituicao;
        });
        document.getElementById('nSimulacoes').addEventListener('input', e => {
            document.getElementById('valN').innerText = e.target.value;
        });

        // --- BOTÃO 1: SORTEAR (LOOP) ---
        document.getElementById('btnSortear').addEventListener('click', async () => {
            const btn = document.getElementById('btnSortear');
            const qtd = parseInt(document.getElementById('qtdJogos').value);
            const fisico = false; 
            const ultimos = document.getElementById('ultimosSorteios').value;

            if (qtd < 1) return;
            btn.innerText = `Gerando ${qtd} jogos...`;
            btn.disabled = true;

            try {
                const jogosGerados = [];
                for (let i = 0; i < qtd; i++) {
                    const url = `https://localhost:7155/api/MegaSena/sortear?fisico=${fisico}&ultimos=${ultimos}&menos=4`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`Erro HTTP: ${response.status}`);
                    const data = await response.json();
                    jogosGerados.push(data.jogos);
                }
                jogosSalvosParaExportar = jogosGerados;
                exibirModalJogos(jogosGerados);
                animarSorteioAPI(jogosGerados[0]);
            } catch (error) {
                console.error("Erro capturado:", error);
                alert(`Erro: ${error.message}`);
            } finally {
                btn.innerText = "Sortear Dezenas (Animado)";
                btn.disabled = false;
            }
        });

        // --- BOTÃO 2: GERAR LOTE (RÁPIDO) ---
        document.getElementById('btnGerarLote').addEventListener('click', async () => {
            const btn = document.getElementById('btnGerarLote');
            const qtd = parseInt(document.getElementById('qtdJogos').value);
            const ultimos = document.getElementById('ultimosSorteios').value;

            if (qtd < 1 || qtd > 50) {
                alert("Escolha uma quantidade entre 1 e 50.");
                return;
            }

            btn.innerText = `Gerando lote...`;
            btn.disabled = true;

            try {
                const response = await fetch('https://localhost:7155/api/MegaSena/gerar-lote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        quantidade: qtd,
                        ultimos: parseInt(ultimos),
                        menos: 4,
                        maxPares: 1
                    })
                });

                if (!response.ok) {
                    const erroData = await response.json();
                    throw new Error(erroData.erro || `Erro HTTP: ${response.status}`);
                }

                const data = await response.json();
                jogosSalvosParaExportar = data.jogos;
                exibirModalJogos(data.jogos);
                animarSorteioAPI(data.jogos[0]);
            } catch (error) {
                console.error("Erro capturado:", error);
                alert(`Erro: ${error.message}`);
            } finally {
                btn.innerText = "Gerar Lote (Rápido)";
                btn.disabled = false;
            }
        });

        // --- FUNÇÃO AUXILIAR PARA O MODAL ---
        function exibirModalJogos(jogos) {
            const modalLista = document.getElementById('modalJogosLista');
            modalLista.innerHTML = ""; 
            jogos.forEach((jogo) => {
                const div = document.createElement('div');
                div.style.backgroundColor = '#333';
                div.style.padding = '12px';
                div.style.borderRadius = '4px';
                div.style.borderLeft = '4px solid #4CAF50';
                div.style.fontSize = '1.3rem';
                div.style.fontWeight = 'bold';
                div.style.color = '#FFEB3B';
                div.style.textAlign = 'center';
                const dezenasTexto = jogo.map(n => n.toString().padStart(2, '0')).join(' - ');
                div.innerText = dezenasTexto;
                modalLista.appendChild(div);
            });
            document.getElementById('modalJogosFundo').style.display = 'flex';
        }

        // --- LÓGICA DE UNIFORMIDADE ---
        document.getElementById('btnUniformidade').addEventListener('click', async () => {
            const btn = document.getElementById('btnUniformidade');
            const nSimulacoes = parseInt(document.getElementById('nSimulacoes').value);
            const ultimos = document.getElementById('ultimosSorteios').value;

            const modalFundo = document.getElementById('modalFundo');
            const iconeModal = document.getElementById('iconeModal');
            const modalTitulo = document.getElementById('modalTitulo');
            const modalCorpo = document.getElementById('modalCorpo');
            const btnFechar = document.getElementById('btnFecharModal');

            iconeModal.innerText = "⏳";
            modalTitulo.innerText = "Investigando o Sorteio...";
            modalTitulo.style.color = "#fff";
            btnFechar.style.display = 'none';
            
            modalCorpo.innerHTML = `
                Calma, matemático não usa bola de cristal! 🔮<br><br>
                Estamos simulando <strong>${nSimulacoes} sorteios</strong> nos bastidores para verificar se o nosso globo virtual é justo.<br><br>
                <span style="font-size: 0.85rem; color: #888;">
                    Pense nisso como jogar uma moeda 300 vezes. Se der 200 caras e 100 coroas, a moeda está viciada. Nós estamos fazendo esse teste com as 60 dezenas para garantir que <strong>nenhuma dezena tem mais chance que a outra</strong>.
                </span>
            `;
            modalFundo.style.display = 'flex';
            
            btn.innerText = "Analisando...";
            btn.disabled = true;

            try {
                const response = await fetch(`https://localhost:7155/api/MegaSena/uniformidade?fisico=true&n=${nSimulacoes}&ultimos=${ultimos}&menos=4`);
                if (!response.ok) throw new Error("Erro na API");
                const data = await response.json();
                
                if (data.aprovado) {
                    iconeModal.innerText = "✅";
                    modalTitulo.innerText = "Globo Justo!";
                    modalTitulo.style.color = "#4CAF50";
                    modalCorpo.innerHTML = `
                        <strong style="color: #4CAF50;">Pode confiar!</strong><br><br>
                        A matemática provou que todas as dezenas têm exatamente a mesma chance de sair.<br><br>
                        Se você apostar na dezena 01 ou na dezena 60, a probabilidade é idêntica. Não há números "viciados" ou com mais peso.
                        <br><br>
                        <span style="font-size: 0.8rem; color: #666;">
                            (Análise técnica: Qui-quadrado ${data.quiQuadrado.toFixed(2)} dentro do limite aceitável de ${data.limite})
                        </span>
                    `;
                } else {
                    iconeModal.innerText = "⚠️";
                    modalTitulo.innerText = "Atenção: Possível Viés!";
                    modalTitulo.style.color = "#F44336";
                    modalCorpo.innerHTML = `
                        <strong style="color: #F44336;">O que aconteceu?</strong><br><br>
                        O teste identificou que algumas dezenas podem estar saindo mais que o normal.<br><br>
                        <em>Tente rodar a análise novamente com uma quantidade maior de simulações. Pode ter sido apenas uma coincidência estatística.</em>
                        <br><br>
                        <span style="font-size: 0.8rem; color: #666;">
                            (Análise técnica: Qui-quadrado ${data.quiQuadrado.toFixed(2)} acima do limite de ${data.limite})
                        </span>
                    `;
                }
            } catch (error) {
                iconeModal.innerText = "❌";
                modalTitulo.innerText = "Erro de Conexão";
                modalTitulo.style.color = "#F44336";
                modalCorpo.innerHTML = "Não foi possível conectar ao servidor para fazer a análise.";
            } finally {
                btn.innerText = "Analisar se o globo é justo";
                btn.disabled = false;
                btnFechar.style.display = 'block';
            }
        });

        // --- CLASSES E FÍSICA DO GLOBO ---
        class Bola {
            constructor(numero, x, y) {
                this.numero = numero;
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = (Math.random() - 0.5) * 5;
                this.raio = 18;
                this.sorteada = false;
            }

            update(dt) {
                if (this.sorteada) {
                    this.y -= 15 * dt;
                    this.x += this.vx * dt;
                    return;
                }
                this.vy += config.gravidade * dt;
                if (this.y > centerY + raioGlobo * 0.3) {
                    this.vy -= config.vento * dt;
                }
                this.vx += (Math.random() - 0.5) * config.turbulencia * 10 * dt;
                this.vy += (Math.random() - 0.5) * config.turbulencia * 10 * dt;
                this.vx *= 0.99;
                this.vy *= 0.99;
                this.x += this.vx * dt;
                this.y += this.vy * dt;
            }

            draw(ctx) {
                if (this.sorteada && this.y < -50) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.raio, 0, Math.PI * 2);
                ctx.fillStyle = this.sorteada ? '#FFEB3B' : '#fff';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.stroke();
                ctx.fillStyle = '#000';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.numero, this.x, this.y);
            }
        }

        let bolas = [];
        let animacaoRodando = true;

        function iniciarSimulacao() {
            bolas = [];
            for (let i = 1; i <= 60; i++) {
                const angulo = Math.random() * Math.PI * 2;
                const dist = Math.random() * (raioGlobo - 25);
                const x = centerX + Math.cos(angulo) * dist;
                const y = centerY + Math.sin(angulo) * dist;
                bolas.push(new Bola(i, x, y));
            }
        }

        function atualizarFisica(dt) {
            for (const bola of bolas) bola.update(dt);
            for (let i = 0; i < bolas.length; i++) {
                if (bolas[i].sorteada) continue;
                for (let j = i + 1; j < bolas.length; j++) {
                    if (bolas[j].sorteada) continue;
                    const dx = bolas[i].x - bolas[j].x;
                    const dy = bolas[i].y - bolas[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = bolas[i].raio + bolas[j].raio;
                    if (dist < minDist && dist > 0) {
                        const overlap = (minDist - dist) / 2;
                        const nx = dx / dist;
                        const ny = dy / dist;
                        bolas[i].x += nx * overlap;
                        bolas[i].y += ny * overlap;
                        bolas[j].x -= nx * overlap;
                        bolas[j].y -= ny * overlap;
                        const p = (bolas[i].vx * nx + bolas[i].vy * ny) - (bolas[j].vx * nx + bolas[j].vy * ny);
                        if (p > 0) {
                            bolas[i].vx -= p * nx * config.restituicao;
                            bolas[i].vy -= p * ny * config.restituicao;
                            bolas[j].vx += p * nx * config.restituicao;
                            bolas[j].vy += p * ny * config.restituicao;
                        }
                    }
                }
            }
            for (const bola of bolas) {
                if (bola.sorteada) continue;
                const dx = bola.x - centerX;
                const dy = bola.y - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const limite = raioGlobo - bola.raio;
                if (dist > limite) {
                    const nx = dx / dist;
                    const ny = dy / dist;
                    bola.x = centerX + nx * limite;
                    bola.y = centerY + ny * limite;
                    const velNormal = bola.vx * nx + bola.vy * ny;
                    if (velNormal > 0) {
                        bola.vx -= (1 + config.restituicao) * velNormal * nx;
                        bola.vy -= (1 + config.restituicao) * velNormal * ny;
                    }
                }
            }
        }

        function desenhar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.arc(centerX, centerY, raioGlobo, 0, Math.PI * 2);
            ctx.strokeStyle = '#4CAF50';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(centerX - 30, centerY - raioGlobo);
            ctx.lineTo(centerX + 30, centerY - raioGlobo);
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#FFEB3B';
            ctx.stroke();
            for (const bola of bolas) bola.draw(ctx);
        }

        let lastTime = performance.now();
        function loop(time) {
            if (!animacaoRodando) return;
            const dt = Math.min((time - lastTime) / 16.66, 2);
            lastTime = time;
            atualizarFisica(dt);
            desenhar();
            requestAnimationFrame(loop);
        }

        function animarSorteioAPI(dezenas) {
            bolas.forEach(b => {
                b.sorteada = false;
                const angulo = Math.random() * Math.PI * 2;
                const dist = Math.random() * (raioGlobo - 25);
                b.x = centerX + Math.cos(angulo) * dist;
                b.y = centerY + Math.sin(angulo) * dist;
            });
            setTimeout(() => {
                dezenas.forEach((numero, index) => {
                    setTimeout(() => {
                        const bola = bolas.find(b => b.numero === numero && !b.sorteada);
                        if (bola) bola.sorteada = true;
                    }, index * 300);
                });
            }, 500);
        }

        function exportarCSV() {
            if (jogosSalvosParaExportar.length === 0) {
                alert("Nenhum jogo para exportar.");
                return;
            }
            let csvContent = "Jogo;Dezena1;Dezena2;Dezena3;Dezena4;Dezena5;Dezena6\n";
            jogosSalvosParaExportar.forEach((jogo, index) => {
                const dezenasOrdenadas = [...jogo].sort((a, b) => a - b);
                const dezenasFormatadas = dezenasOrdenadas.map(n => n.toString().padStart(2, '0')).join(';');
                csvContent += `${index + 1};${dezenasFormatadas}\n`;
            });
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `meus_jogos_megasena_${new Date().getTime()}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function irParaFechamento() {
            if (jogosSalvosParaExportar.length === 0) return;
            const todasAsDezenas = new Set();
            jogosSalvosParaExportar.forEach(jogo => {
                jogo.forEach(dezena => todasAsDezenas.add(dezena));
            });
            const dezenasBase = Array.from(todasAsDezenas);
            localStorage.setItem('dezenasParaFechamento', JSON.stringify(dezenasBase));
            window.location.href = 'fechamento.html';
        }

        iniciarSimulacao();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
