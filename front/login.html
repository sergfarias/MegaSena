<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MegaSena SaaS</title>
    <style>
        :root {
            --bg-color: #1a1b26;
            --panel-bg: #24283b;
            --text-main: #c0caf5;
            --primary: #7aa2f7;
            --success: #9ece6a;
            --border: #414868;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: var(--primary); text-align: center; margin-bottom: 20px; font-size: 1.5rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #ccc; }
        input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #2ac3de; }
        .link { text-align: center; margin-top: 15px; font-size: 0.9rem; }
        .link a { color: var(--primary); text-decoration: none; cursor: pointer; }
        .link a:hover { text-decoration: underline; }
        #erro { color: #f7768e; text-align: center; font-size: 0.9rem; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>🎰 Acesso ao SaaS</h1>
        <p id="erro"></p>
        
        <div id="camposLogin">
            <div class="form-group">
                <label>Login</label>
                <input type="text" id="login" placeholder="Seu usuário">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Sua senha">
            </div>
            <button onclick="fazerLogin()">Entrar</button>
            
            <div class="link" style="text-align: right; margin-top: 8px;">
                <a href="recuperar-senha.html">Esqueci minha senha</a>
            </div>
            
            <div class="link">
                Não tem conta? <a onclick="mostrarRegistro()">Crie uma agora</a>
            </div>
        </div>

        <div id="camposRegistro" style="display: none;">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="regNome" placeholder="Seu nome">
            </div>
            <div class="form-group">
                <label>Login (Usuário)</label>
                <input type="text" id="regLogin" placeholder="Crie um usuário">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="regSenha" placeholder="Crie uma senha forte">
            </div>
            <button onclick="fazerRegistro()">Criar Conta</button>
            <div class="link">
                Já tem conta? <a onclick="mostrarLogin()">Faça login</a>
            </div>
        </div>
    </div>

    <script>
        // Testando LOCAL
        //const API_URL = 'https://localhost:7155';
        const API_URL = 'https://megasena-api.runasp.net';
	   
        function mostrarRegistro() {
            document.getElementById('camposLogin').style.display = 'none';
            document.getElementById('camposRegistro').style.display = 'block';
            document.getElementById('erro').style.display = 'none';
        }

        function mostrarLogin() {
            document.getElementById('camposRegistro').style.display = 'none';
            document.getElementById('camposLogin').style.display = 'block';
            document.getElementById('erro').style.display = 'none';
        }

        async function fazerLogin() {
            const login = document.getElementById('login').value;
            const senha = document.getElementById('senha').value;
            const erroDiv = document.getElementById('erro');

            try {
                // CORRIGIDO: Usando crase (`) em vez de aspas simples (')
                const response = await fetch(`${API_URL}/api/Auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, senha })
                });

                if (response.status === 429) {
                    const segundos = parseInt(response.headers.get('Retry-After')) || 300;
                    const minutos = Math.ceil(segundos / 60);
                    throw new Error(`Muitas tentativas falhas. Aguarde ${minutos} minuto(s) para tentar novamente.`);
                }

                const data = await response.json();

                if (!response.ok) throw new Error(data.erro || "Erro no login.");

                localStorage.setItem('token', data.token);
                localStorage.setItem('usuarioNome', data.usuario.nome);

                window.location.href = 'fechamento.html';

            } catch (error) {
                erroDiv.style.display = 'block';
                erroDiv.innerText = "❌ " + error.message;
            }
        }

        async function fazerRegistro() {
            const nome = document.getElementById('regNome').value;
            const login = document.getElementById('regLogin').value;
            const email = document.getElementById('regEmail').value;
            const senha = document.getElementById('regSenha').value;
            const erroDiv = document.getElementById('erro');

            try {
                // CORRIGIDO AQUI TAMBÉM (Estava apontando para o login por engano no seu código antigo)
                const response = await fetch(`${API_URL}/api/Auth/registrar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, login, email, senha })
                });

                if (response.status === 429) {
                    const segundos = parseInt(response.headers.get('Retry-After')) || 300;
                    const minutos = Math.ceil(segundos / 60);
                    throw new Error(`Muitas tentativas de cadastro. Aguarde ${minutos} minuto(s).`);
                }

                const data = await response.json();

                if (!response.ok) throw new Error(data.erro || "Erro no registro.");

                alert("Conta criada com sucesso! Faça login.");
                mostrarLogin();

            } catch (error) {
                erroDiv.style.display = 'block';
                erroDiv.innerText = "❌ " + error.message;
            }
        }
    </script>
</body>
</html>
